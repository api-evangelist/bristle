aid: bristle
name: Bristle
description: >-
  Bristle (Bristle Health) is a consumer health company that makes the world's
  first at-home oral microbiome saliva test, helping people measure, understand,
  and improve their oral health. Customers order a mail-in saliva collection kit,
  and Bristle sequences the oral microbiome to report on bacteria associated with
  cavities, gum disease, and bad breath, then pairs the results with guidance and
  a line of targeted oral-care products including probiotics. Bristle also works
  with dental professionals who offer microbiome testing to their patients. The
  company sells direct to consumers through a Shopify-hosted storefront at
  bristlehealth.com and is backed by Initialized Capital. There is no first-party
  public developer API; this profile captures Bristle's public web, commercial,
  and security surface for the API Evangelist network.
